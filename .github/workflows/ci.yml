name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      # Même configuration que `npm run db` en local : Postgres 17 sur le port 5433
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: covercraft_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Types globaux de Next 16 (PageProps, RouteContext…), générés sans build complet
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Tests (Vitest, base Postgres de test)
        run: npm test
      - name: Build de production
        run: npx next build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/covercraft_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5433/covercraft_test
          AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
